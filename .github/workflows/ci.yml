name: postman-api-test

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Install node on the runner
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: 14

      # Install the newman command-line utility, also install the html extra reporter
      - name: Install newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Make directory to upload the test results
      - name: Make directory for uploading the test results
        run: mkdir -p newman_report

      # Run the postman collection
      - name: Run Newman API Tests
        run: newman run "postman-api-test.postman_collection.json" -r htmlextra --reporter-htmlextra-export newman_report/test_report.html

      # Upload the contents of test results directory to workspace
      - name: Output the run details
        uses: actions/upload-artifact@v3
        with:
          name: test-run-reports
          path: newman_report
      
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "8842076-59400164-ddb8-4fc6-8f3e-017e6c08775f" --integration-id "152564-${{ github.run_id }}"
         
      - uses: actions/checkout@master
      - uses: matt-ball/newman-action@master
        with:
          apiKey: ${{ secrets.POSTMAN_API_KEY }}
          collection: 8842076-59400164-ddb8-4fc6-8f3e-017e6c08775f
