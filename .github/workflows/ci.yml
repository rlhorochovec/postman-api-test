name: Testes de API com Postman

on:
  push:
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      # Verifica (faz checkout) o seu repositório no $GITHUB_WORKSPACE para o job poder acessá-lo
      - name: Verificar repositório
        uses: actions/checkout@v4

      # Instala o Node.js no ambiente executor (runner)
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala a ferramenta de linha de comando Newman e o gerador de relatórios em HTML extra
      - name: Instalar Newman e Repórter HTML
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Cria um diretório para armazenar os resultados dos testes gerados
      - name: Criar diretório para relatórios de testes
        run: mkdir -p newman_report

      # Executa a coleção do Postman utilizando o Newman
      - name: Executar testes de API com Newman
        run: newman run "postman-api-test.postman_collection.json" -r htmlextra --reporter-htmlextra-export newman_report/index.html

      # Faz o upload do conteúdo do diretório de resultados como artefato do workflow
      - name: Enviar detalhes da execução (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: test-run-reports
          path: newman_report

      # Publica o relatório gerado no GitHub Pages
      - name: Publicar relatório do Newman no GitHub Pages
        if: always() # Garante que execute mesmo se os testes falharem nas etapas anteriores
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman_report
          publish_branch: gh-pages
      
      # Executa os testes diretamente utilizando a CLI oficial do Postman
      - name: Instalar Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          
      - name: Fazer login na Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
        
      - name: Executar testes de API via Postman CLI
        run: |
          postman collection run "8842076-59400164-ddb8-4fc6-8f3e-017e6c08775f" --integration-id "152564-${{ github.run_id }}"
